<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Everything rendered here came off an untrusted network. The policy is the
     backstop for esc(): even text that slipped through could not load or run
     anything that is not one of these files. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Carta</title>
<!-- Served from the binary like everything else here: the UI must render the
     same on an air-gapped machine as on a connected one. -->
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Design D (docs/DESIGN_SYSTEM_CARTA.md): three columns on a wide screen,
       the map and a sliding sheet on a narrow one. In the Android app
       (?embedded) the app draws the top and bottom bars itself. -->
  <header class="top" id="top">
    <span class="mark">CARTA</span>
    <span class="tool">Survey</span>
  </header>

  <main id="main">
    <section class="summary" id="summary" aria-label="This survey">
      <h1><span id="count">…</span><small id="prefix"></small></h1>
      <dl class="facts" id="facts"></dl>
      <p class="factline" id="factline"></p>
      <div class="coverage" id="coverage">
        <div class="caps">Coverage</div>
        <div class="matrix" id="matrix" role="img"></div>
        <div class="counts" id="counts"></div>
        <p class="note" id="covnote"></p>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="mapwrap" id="mapwrap">
      <!-- The map is a picture a screen reader cannot walk, so the first thing
           it reaches is a way past it to the same devices as a list. -->
      <a class="skip" href="#body" id="skip">Skip the map: list every device</a>
      <svg id="map" role="img" aria-label="Network map"></svg>
      <div class="maptop"><span class="caps">Map</span><span class="hint">click a device, drag to pan, scroll to zoom</span></div>
      <div class="legend" id="legend">
        <span><i class="key named"></i>identified</span>
        <span><i class="key partial"></i>partly known</span>
        <span><i class="key unknown"></i>unidentified</span>
      </div>
      <button class="link fit" id="fit">Fit</button>
    </section>

    <aside class="panel" id="panel" aria-label="Details">
      <div class="grip" id="grip"><button class="handle" id="handle" aria-expanded="false" aria-label="Details panel"><span></span></button></div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Survey details">
        <button role="tab" id="tab-device" aria-controls="body" data-tab="device">Device</button>
        <button role="tab" id="tab-findings" aria-controls="body" data-tab="findings">Findings<sup id="nFindings"></sup></button>
        <button role="tab" id="tab-devices" aria-controls="body" data-tab="devices">Devices<sup id="nDevices"></sup></button>
        <button role="tab" id="tab-drift" aria-controls="body" data-tab="drift" class="hidden">Drift<sup id="nDrift"></sup></button>
      </nav>
      <div class="body" id="body" role="tabpanel" tabindex="0"></div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
