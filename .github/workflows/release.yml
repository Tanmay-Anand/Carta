# Publishes one GitHub Release per version tag, with everything Carta ships:
#
#   carta-vX.Y.Z.apk                           the Android app, signed
#   carta-desktop-vX.Y.Z-windows-amd64.exe     Carta Desktop, portable
#   carta-desktop-vX.Y.Z-linux-amd64.tar.xz    Carta Desktop, with a .desktop entry
#   carta-vX.Y.Z-<os>-<arch>[.exe]             the CLI, six static binaries
#   SHA256SUMS                                 a checksum for each of the above
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Obtainium on the phone watches these releases and installs the one .apk, so
# every release must carry exactly one. The release is created only after
# every job has succeeded: a release missing its APK would look like the
# latest version to Obtainium and offer nothing to install.
#
# One-time setup: the four signing secrets (docs/RELEASING.md). Every APK is
# signed with the same key, so each one installs over the last.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Obtainium compares the release tag with the installed versionName, so a
      # tag that disagrees with internal/version/VERSION would offer an update
      # that never ends.
      - name: Tag must match internal/version/VERSION
        run: |
          VERSION=$(tr -d '[:space:]' < internal/version/VERSION)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match internal/version/VERSION $VERSION"
            exit 1
          fi

      - name: This version has release notes
        run: |
          if ! grep -qx "## $GITHUB_REF_NAME" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md has no '## $GITHUB_REF_NAME' section"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test the core and the binding
        run: |
          go vet ./... && go test -race ./...
          cd mobile && go vet ./... && go test ./...

  cli:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Static, with no cgo: the same binary runs on any machine of its OS.
      - name: Build every target
        run: |
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "out/carta-$GITHUB_REF_NAME-$os-$arch$ext" ./cmd/carta
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: out/*
          if-no-files-found: error

  desktop:
    needs: check
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: Carta.exe
            asset: windows-amd64.exe
          - os: ubuntu-latest
            file: Carta.tar.xz
            asset: linux-amd64.tar.xz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # Fyne draws with OpenGL through cgo: a C compiler everywhere, and the
      # X11 and GL headers on Linux (Fyne's documented list).
      - name: C compiler and graphics headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
      - name: C compiler
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Put gcc on PATH
        if: runner.os == 'Windows'
        run: echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Test
        working-directory: desktop
        run: go vet ./... && go test ./...

      - name: Package
        run: |
          go install fyne.io/tools/cmd/fyne@v1.7.4
          bash desktop/package.sh
          mkdir -p out
          mv "dist/${{ matrix.file }}" "out/carta-desktop-$GITHUB_REF_NAME-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The action's default package list still names "tools", which the SDK
      # repository no longer has, so sdkmanager fails unless we name our own.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install the NDK and gomobile
        run: |
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-36"
          cd mobile
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: Decode the signing key
        env:
          CARTA_KEYSTORE_B64: ${{ secrets.CARTA_KEYSTORE_B64 }}
        run: |
          if [ -z "$CARTA_KEYSTORE_B64" ]; then
            echo "::error::Repository secret CARTA_KEYSTORE_B64 is not set (docs/RELEASING.md)"
            exit 1
          fi
          echo "$CARTA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/carta.jks"

      # bindGo runs inside this build: Gradle rebuilds the .aar from the Go
      # sources, so the APK can never pair the Kotlin shell with a stale core.
      - name: Build the release APK
        working-directory: android
        env:
          CARTA_KEYSTORE_PATH: ${{ runner.temp }}/carta.jks
          CARTA_KEYSTORE_PASSWORD: ${{ secrets.CARTA_KEYSTORE_PASSWORD }}
          CARTA_KEY_ALIAS: ${{ secrets.CARTA_KEY_ALIAS }}
          CARTA_KEY_PASSWORD: ${{ secrets.CARTA_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Verify the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/carta-$GITHUB_REF_NAME.apk"
          rm -f "$RUNNER_TEMP/carta.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  publish:
    needs: [cli, desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          if [ "$(ls *.apk | wc -l)" -ne 1 ]; then
            echo "::error::a release must carry exactly one .apk, for Obtainium"
            exit 1
          fi

      - name: Extract this version's release notes
        run: |
          awk -v h="## $GITHUB_REF_NAME" '$0==h{f=1;next} /^## /{if(f)exit} f' RELEASE_NOTES.md \
            | sed '/^---$/d' > notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Carta $GITHUB_REF_NAME" \
            --notes-file notes.md
